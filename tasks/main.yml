---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dearmor Docker GPG key
  ansible.builtin.command: >
    gpg --dearmor -o {{ docker_gpg_dest }} /etc/apt/keyrings/docker.asc
  args:
    creates: "{{ docker_gpg_dest }}"

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by={{ docker_gpg_dest }}]
      {{ docker_repo_url }} {{ ansible_distribution_release }} {{ docker_channel }}
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: "{{ docker_state }}"
    update_cache: true

- name: Manage Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: "{{ docker_service_enabled }}"
    state: "{{ docker_service_state }}"
